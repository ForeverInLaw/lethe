[package]
name = "lethe-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true

# M1 integration #3. MTProto via TDLib. api_id/api_hash are INJECTED
# (BYO-first) -- zero secrets in this crate, so a ban hits one user, not all.
# Batch delete = deleteMessages (list).
#
# NOTE: TDLib opens raw TCP to Telegram DCs (not HTTP through lethe-net). The CI
# zero-egress gate must account for the native TDLib process/library separately.

# grammers-client 0.9.0 currently fails to resolve (grammers-crypto -> yanked
# glass_pumpkin 1.10.0), so TDLib is the active path.
[features]
default = []
# Type-checks the generated TDLib Rust API. It is for cargo check; cargo test
# still links a test binary and needs native tdjson symbols.
tdlib-docs = ["dep:tdlib-rs", "tdlib-rs/docs"]
# Live builds require TDLib 1.8.61 from LOCAL_TDLIB_PATH.
tdlib-local = ["dep:tdlib-rs", "tdlib-rs/local-tdlib"]
# Non-default spike only: downloads prebuilt TDLib during build.
tdlib-download = ["dep:tdlib-rs", "tdlib-rs/download-tdlib"]
# Pair with tdlib-local or tdlib-download if the live binary should statically link tdjson.
tdlib-static = ["dep:tdlib-rs", "tdlib-rs/static"]

[dependencies]
lethe-adapter.workspace = true
async-trait.workspace = true
futures.workspace = true
thiserror.workspace = true
tdlib-rs = { version = "1.4.0", optional = true, default-features = false }
