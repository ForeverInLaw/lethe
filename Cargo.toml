# Lethe — open-core deletion engine (PUBLIC repo).
# INVARIANT: no crate here may depend on the `untrace` tree.
# `lethe-cli` must build + run a full vertical with zero `untrace` deps
# (it is the reproducible-build / zero-egress CI target).

[workspace]
resolver = "2"
members = [
    "crates/lethe-adapter",
    "crates/lethe-net",
    "crates/lethe-core",
    "crates/lethe-crypto",
    "crates/lethe-store",
    "crates/adapters/bluesky",
    "crates/adapters/vk",
    "crates/adapters/telegram",
    "crates/lethe-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/ForeverInLaw/lethe"

[workspace.dependencies]
# --- async / core ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures = "0.3"
async-trait = "0.1"
# --- serde / util ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
regex = "1"
# --- network (only via the egress chokepoint) ---
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# --- crypto (single dependency: archive AEAD + Ed25519 receipts) ---
dryoc = "0.8"
argon2 = "0.5"
# --- store (encrypted) ---
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "serde_json"] }
# OS secret vault is wired at the app layer (untrace); the engine stays
# vault-agnostic and only ever sees opaque Credential blobs.
# --- platform SDKs ---
atrium-api = "0.25"
atrium-xrpc-client = "0.5"
bsky-sdk = "0.1"
# Telegram uses tdlib-rs behind adapter-local feature gates. The docs feature
# lets CI type-check the bridge without linking native TDLib; live builds must
# opt in to local/download TDLib explicitly.
# --- internal ---
lethe-adapter = { path = "crates/lethe-adapter" }
lethe-net = { path = "crates/lethe-net" }
lethe-core = { path = "crates/lethe-core" }
lethe-crypto = { path = "crates/lethe-crypto" }
lethe-store = { path = "crates/lethe-store" }
lethe-bluesky = { path = "crates/adapters/bluesky" }
lethe-vk = { path = "crates/adapters/vk" }
lethe-telegram = { path = "crates/adapters/telegram" }

[profile.release]
lto = true
codegen-units = 1
