name: CI
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test Telegram bridge
        run: cargo test -p lethe-telegram --features tdlib-download --locked
  windows-store:
    # SQLCipher links the system OpenSSL on Windows, and the store's build script copies
    # its runtime next to the binaries so they start without OpenSSL on PATH.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install OpenSSL
        run: choco install openssl --no-progress -y
      - name: Test store
        shell: pwsh
        run: |
          Get-ChildItem "C:\Program Files\OpenSSL*\bin" -Filter 'libcrypto-*.dll' | ForEach-Object FullName
          $ssl = "C:\Program Files\OpenSSL-Win64", "C:\Program Files\OpenSSL" |
            Where-Object { Test-Path "$_\include\openssl" } | Select-Object -First 1
          if (-not $ssl) { throw "OpenSSL with headers was not found" }
          $lib = Get-ChildItem $ssl -Recurse -Filter libcrypto.lib |
            Sort-Object { $_.FullName -notmatch 'x64\\MD' } | Select-Object -First 1
          if (-not $lib) { throw "libcrypto.lib was not found under $ssl" }
          Write-Host "Linking OpenSSL from $ssl, $($lib.DirectoryName)"
          $env:OPENSSL_DIR = $ssl
          $env:OPENSSL_INCLUDE_DIR = "$ssl\include"
          $env:OPENSSL_LIB_DIR = $lib.DirectoryName
          cargo test -p lethe-store --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $copied = Get-ChildItem target\debug\deps -Filter 'libcrypto-*-x64.dll'
          if (-not $copied) { throw "the OpenSSL runtime was not copied next to the binaries" }
          Write-Host "Copied $($copied.Name)"
